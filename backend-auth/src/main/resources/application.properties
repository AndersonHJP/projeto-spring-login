spring.application.name=backend-auth

# Le o .env da raiz quando ele existir (IDE e mvnw). 'optional:' ignora a ausencia
# em CI e no container. Variaveis de ambiente reais tem precedencia sobre ele.
spring.config.import=optional:file:./.env[.properties]
spring.datasource.url=jdbc:postgresql://localhost:5433/userdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.time-zone=America/Sao_Paulo

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================= STORAGE =================
# Cada storage.backends.<nome> e um endpoint S3-compativel. O <nome> e o valor
# gravado na coluna 'provider' de cada foto - nao mude o de um backend que ja tem
# fotos gravadas, senao elas ficam sem quem as leia.
#
# storage.enabled  = de quais backends da para LER (lista separada por virgula)
# storage.provider = para onde vao as fotos NOVAS (um so, e tem de constar acima)
#
# Provedor novo (R2, Spaces, Wasabi) e so um bloco novo aqui: nao existe classe
# por provedor.

storage.enabled=${STORAGE_ENABLED:${STORAGE_PROVIDER:minio}}
storage.provider=${STORAGE_PROVIDER:minio}

# --- Amazon S3 (nuvem) ---
# Sem endpoint proprio: regiao real e, sem chaves declaradas, a cadeia padrao do
# SDK (ambiente, ~/.aws, IAM role) - que e o certo em producao.
storage.backends.s3.display-name=Amazon S3
storage.backends.s3.env-prefix=AWS_S3
storage.backends.s3.bucket=${AWS_S3_BUCKET:}
storage.backends.s3.region=${AWS_S3_REGION:}
storage.backends.s3.access-key=${AWS_ACCESS_KEY_ID:}
storage.backends.s3.secret-key=${AWS_SECRET_ACCESS_KEY:}

# --- MinIO local (Docker) ---
# Endpoint proprio: exige chave e segredo, usa path-style e ganha o bucket criado
# no startup, porque o container sobe com o volume vazio.
storage.backends.minio.display-name=MinIO
storage.backends.minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
storage.backends.minio.bucket=${MINIO_BUCKET:app-photos-bucket}
storage.backends.minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
storage.backends.minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
storage.backends.minio.create-bucket-if-missing=true

# ================= UPLOAD =================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
