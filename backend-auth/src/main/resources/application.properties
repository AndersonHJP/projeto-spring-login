spring.application.name=backend-auth
spring.datasource.url=jdbc:postgresql://localhost:5433/userdb
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jackson.time-zone=America/Sao_Paulo

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# ================= STORAGE =================
storage.provider=${STORAGE_PROVIDER:s3}

# ================= AWS S3 =================

aws.s3.bucket=${AWS_S3_BUCKET}
aws.s3.region=${AWS_S3_REGION}
aws.s3.presign-expiration-minutes=15

# ================= MINIO =================
minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.bucket=${MINIO_BUCKET:app-photos-bucket}
minio.access-key=${MINIO_ACCESS_KEY:minioadmin}
minio.secret-key=${MINIO_SECRET_KEY:minioadmin}
minio.presign-expiration-minutes=15

# ================= UPLOAD =================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB